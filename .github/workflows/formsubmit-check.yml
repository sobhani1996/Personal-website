# Temporary: diagnoses why the client brief can't reach FormSubmit. Delete after use.
name: FormSubmit check
on:
  push:
    branches: [claude/website-github-hosting-4b4e4s]
    paths: [.github/workflows/formsubmit-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight (OPTIONS)
        run: |
          curl -sS -i -X OPTIONS https://formsubmit.co/ajax/mori@mrsobhani.uk \
            -H "Origin: https://mrsobhani.uk" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | head -30
      - name: Simple payload (like the contact form)
        run: |
          curl -sS -i https://formsubmit.co/ajax/mori@mrsobhani.uk \
            -H "Origin: https://mrsobhani.uk" -H "Referer: https://mrsobhani.uk/contact/" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data '{"name":"Website check","email":"test@example.com","message":"Automated check of the website form. Please ignore.","_subject":"TEST - please ignore (contact form check)","_template":"table"}' | head -40
      - name: Brief payload (as the brief page sends it)
        run: |
          cat > brief.json <<'JSON'
          {"_subject":"TEST - please ignore (client brief check)","_template":"table","_replyto":"test@example.com","— 1. About you and your business —":"4 of 11 answered","Your name":"Website check","Business name":"Test","Email":"test@example.com","Phone / WhatsApp":"07000 000000","What you sell, in one or two sentences":"Line one\nLine two","— 2. What you want from advertising —":"2 of 7 answered","Which channel are you interested in?":"Not sure","What should a successful ad bring you?":"Online sales, Phone calls","— 5. Numbers, budget and timeline —":"2 of 8 answered","Average order or job value":"£85","Monthly ad budget you're comfortable paying Google / Meta":"£500 – £1,500"}
          JSON
          sleep 5
          curl -sS -i https://formsubmit.co/ajax/mori@mrsobhani.uk \
            -H "Origin: https://mrsobhani.uk" -H "Referer: https://mrsobhani.uk/brief/" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data @brief.json | head -40
