name: Copy Manus-hosted media into the repo

# One-off helper: downloads images and videos that the site still loads from
# Manus storage (cloudfront / manuscdn) into client/public/media, so the site
# serves them itself. Runs when the URL list changes on the working branch.
on:
  push:
    branches: [claude/website-github-hosting-4b4e4s]
    paths: [.github/manus-media-urls.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download media
        run: |
          mkdir -p client/public/media
          : > .github/manus-media-report.txt
          while read -r url; do
            [ -z "$url" ] && continue
            name="${url##*/}"
            out="client/public/media/$name"
            code=$(curl -sSL -A "Mozilla/5.0" -o "$out" -w "%{http_code}" "$url" || echo "000")
            if [ "$code" != "200" ]; then
              code2=$(curl -sSL -A "Mozilla/5.0" -e "https://manus.im/" -o "$out" -w "%{http_code}" "$url" || echo "000")
              [ "$code2" = "200" ] && code="200-with-referer" || code="$code/$code2"
            fi
            if [[ "$code" == 200* ]] && [ -s "$out" ]; then
              type=$(file -b --mime-type "$out")
              size=$(stat -c %s "$out")
              echo "OK $code $type $size $url" >> .github/manus-media-report.txt
            else
              rm -f "$out"
              echo "FAIL $code $url" >> .github/manus-media-report.txt
            fi
          done < .github/manus-media-urls.txt
          echo "OK: $(grep -c '^OK' .github/manus-media-report.txt)  FAIL: $(grep -c '^FAIL' .github/manus-media-report.txt || true)"
          du -sh client/public/media || true

      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/media .github/manus-media-report.txt
          git commit -m "Copy Manus-hosted media into the repo" || echo "nothing to commit"
          git push
